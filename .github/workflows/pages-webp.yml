name: Pages lossless WebP build and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-webp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Build and verify lossless WebP artifact under 1 GB
        run: python tools/build_pages.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check screens, stories and images
        run: |
          python -m http.server 8765 --directory _site >/tmp/pages-http.log 2>&1 &
          node tools/pages_smoke.cjs
      - name: Measure the actual uncompressed Pages tar
        run: |
          tar --dereference --hard-dereference -cf /tmp/pages-size.tar -C _site .
          python - <<'PY'
          import json
          from pathlib import Path
          n = Path('/tmp/pages-size.tar').stat().st_size
          report = json.loads(Path('pages-build-report.json').read_text())
          report['artifact_tar_bytes'] = n
          Path('pages-build-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(f'Pages tar: {n} bytes')
          assert n < 1_000_000_000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pages-build-report
          path: |
            pages-build-report.json
            pages-smoke-report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
