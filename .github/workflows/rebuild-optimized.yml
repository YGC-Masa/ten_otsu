name: Rebuild optimized repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out destination
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick rsync

      - name: Copy the legacy working tree without history
        run: |
          git clone --depth 1 https://github.com/YGC-Masa/ten_otsu-legacy-20261016.git /tmp/ten_otsu_legacy
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf -- {} +
          rsync -a --exclude=.git /tmp/ten_otsu_legacy/ ./

      - name: Remove superseded unreferenced character assets
        run: |
          rm -rf -- \
            images/assets/char/ad_kogane/standing/legacy_broken_20260911 \
            images/assets/char/legacy_moe_pre25_20260912 \
            images/assets/char/ba_koharu/standing/legacy_koharu_precanonical_20260913

      - name: Convert images and update references
        run: |
          python3 .github/scripts/optimize_assets.py . --legacy-tree /tmp/ten_otsu_legacy

      - name: Verify rebuilt tree
        run: |
          if find images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print -quit | grep -q .; then
            echo "Legacy PNG/JPEG assets remain under images/"
            exit 1
          fi
          node --test tests/*.test.cjs
          du -sh .
          find images -type f | wc -l

      - name: Commit optimized rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Rebuild repository with optimized WebP assets"
          git push origin HEAD:main
